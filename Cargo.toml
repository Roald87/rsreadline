[package]
name = "rsreadline"
version = "0.1.0"
edition = "2024"

[lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"

[lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[dev-dependencies]
nix = { version = "0.31.3", features = ["fs", "process", "term", "ioctl", "poll", "signal"] }
